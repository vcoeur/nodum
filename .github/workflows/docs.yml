name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # Build the site on any PR touching the docs, so a broken build — and, via
  # mkdocs --strict + the validation block, a broken link or an orphan page —
  # fails the PR. The deploy job is gated to non-PR events, so a PR build can
  # never publish to Pages.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR runs get their own self-cancelling group (only the latest docs PR build
  # runs); push and manual runs keep the `pages` group with no cancellation,
  # so a PR build never queues behind or cancels a Pages deploy and vice versa.
  group: ${{ github.event_name == 'pull_request' && 'docs-pr' || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --strict fails the build on any warning, and mkdocs.yml's validation
      # block raises the orphan-page and broken-anchor checks from INFO to
      # WARN, so a stale doc cannot silently build (or deploy on main). mkdocs
      # is pinned to the version mkdocs-material 9.7.7 resolves, so the
      # ephemeral build env is reproducible; --locked keeps the project lock
      # honest like every other CI leg.
      - name: Build site
        run: uv run --locked --with "mkdocs==1.6.1" --with "mkdocs-material==9.7.7" mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    # Build runs on push, PR and manual dispatch; only non-PR events may
    # publish Pages (a PR can never deploy, and workflow_dispatch keeps its
    # current manual-deploy behaviour).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
