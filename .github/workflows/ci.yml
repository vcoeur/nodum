name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Ruff check
        run: uv run --locked ruff check .
      - name: Ruff format check
        run: uv run --locked ruff format --check .
      # Pyright resolves optional-extras imports (pypdf/pypdfium2 in the `pdf`
      # extra) the same way the test job installs them, so a fresh CI venv sees
      # what a developer's pdf-enabled venv sees — an import the lint leg cannot
      # resolve is a real gap, not an absent-extra artifact.
      - name: Pyright typecheck
        run: uv run --locked --extra pdf pyright nodum

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The `pdf` extra is installed because PDFs are the phase-4 exit
      # criterion ("drop a folder of PDFs, get a reviewable subgraph"), so the
      # real extraction and page-raster paths have to run here rather than
      # only their degraded ones. `ocr` and `audio` are deliberately left out:
      # they need a system binary and a large model respectively, and their
      # dependency-absent branches — the ones most installs take — are what
      # the suite asserts.
      - name: Run test suite
        run: uv run --locked --extra pdf pytest -q

  # The "highest resolution" gate. A plain `uv sync` keeps any lock that
  # already satisfies pyproject.toml, so this leg must `--upgrade`: it resolves
  # every dep at the newest version its bound allows and runs the suite there.
  # An unbounded major that breaks an import — the mcp 2.0.0 removal of
  # mcp.server.fastmcp class — fails loudly here instead of on a fresh install.
  # It is allowed to break: that is its job. The `pdf` extra mirrors the
  # `--locked` leg so both cover the same surface.
  test-highest:
    name: Tests (highest resolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Resolve dependencies at their highest allowed versions
        run: uv sync --upgrade --extra pdf
      - name: Run test suite
        run: uv run --extra pdf pytest -q

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the frontend dependencies
        run: make web-install
      # Vitest over the pure modules in web/src. The suite pins its own
      # timezone: this runner is UTC, and the zone-less-timestamp bug
      # src/lib/time.ts fixes is invisible in UTC.
      - name: Frontend unit tests
        run: make web-test
      # ESLint over web/src (react-hooks/exhaustive-deps at error), so a
      # stale hook closure fails here instead of in review.
      - name: Frontend lint
        run: make web-lint
      # The frontend is the only half of this project with a dependency tree
      # big enough to carry advisories nobody here will hear about otherwise —
      # the Python side is eight direct runtime deps, all bounded and read at
      # every review. `--audit-level=high` so a low-severity transitive finding
      # is not a red build; `continue-on-error` because an advisory published
      # overnight must not block an unrelated PR, and the annotation is the
      # point. Reachability is still a judgement: a react-router RSC-mode
      # advisory does not touch a router this SPA drives in browser mode.
      - name: Frontend advisories
        continue-on-error: true
        run: cd web && npm audit --audit-level=high
      # `web-build` runs `tsc --noEmit` before Vite, so this step is the type
      # check as well as the build — the frontend cannot rot silently.
      - name: Build the UI bundle
        run: make web-build
      - name: Check the bundle was emitted
        run: test -f nodum/_web/index.html && test -d nodum/_web/assets

  # The browser leg. `web-test` covers the pure modules and this repo renders no
  # component in a harness by design, so everything React puts on screen is
  # verified here or nowhere. It needs both runtimes: Node for Playwright, uv
  # for the `nodum serve` the fixture seeds and starts.
  e2e:
    name: Frontend end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the frontend dependencies
        run: make web-install
      - name: Install the Python project
        run: uv sync --locked
      # No system Chrome to rely on here, so the config's `channel` falls
      # through to this browser (see web/playwright.config.ts).
      - name: Install the browser
        run: cd web && npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: make web-e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
