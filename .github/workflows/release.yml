name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Same extra as ci.yml — a release gate that skips the PDF path would
      # be a weaker gate than the one every pull request already passes.
      - name: Run test suite
        run: uv run --locked --extra pdf pytest -q

  # The three legs ci.yml runs that this workflow used to skip (finding M3).
  # A tag push does not trigger ci.yml, and the comment on `build-and-publish`
  # claimed the tag gate was "not weaker than the PR gate" while ruff, pyright,
  # the ceiling resolution and the whole frontend suite ran on neither. Usually
  # a tag names a commit that already passed ci.yml on its PR — but "usually"
  # is what a release gate exists to not depend on, and this project has
  # already pushed a tag at a tree that was never the merged one (v0.12.0
  # published a pre-merge state).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Ruff check
        run: uv run --locked ruff check .
      - name: Ruff format check
        run: uv run --locked ruff format --check .
      - name: Pyright typecheck
        run: uv run --locked --extra pdf pyright nodum

  # The leg that exists *for* the class of break a release ships: an unbounded
  # dependency major that resolves differently for a user than for the lock.
  # Running it anywhere but the release path was the gap — `smoke` catches the
  # import half of that class, and a behavioural break at the ceiling imports
  # fine.
  test-highest:
    name: Tests (highest resolution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Resolve dependencies at their highest allowed versions
        run: uv sync --upgrade --extra pdf
      - name: Run test suite
        run: uv run --extra pdf pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the frontend dependencies
        run: make web-install
      - name: Frontend unit tests
        run: make web-test
      - name: Frontend lint
        run: make web-lint

  smoke:
    name: Clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The bundle must exist before the wheel is built, or the smoke test
      # would exercise a placeholder wheel and pass while the real artifact
      # was broken. NODUM_SMOKE_REQUIRE_WEB makes the bundle assertion fatal
      # here, so this step cannot silently become a no-op.
      - name: Build the UI bundle
        run: make web-install web-build
      # The smoke script also imports every module of the installed wheel, so a
      # lazy-import break (mcp 2.0.0) cannot reach a release either.
      - name: Clean-install smoke
        env:
          NODUM_SMOKE_REQUIRE_WEB: "1"
        run: bash scripts/smoke-install.sh

  build-and-publish:
    name: Build and publish to PyPI
    # Never publish a wheel that fails tests, or one that fails to install and
    # self-describe clean — tag pushes do not trigger ci.yml, so the release
    # workflow must gate on the suite itself.
    #
    # `needs` names every job ci.yml has, so the tag gate is not weaker than the
    # PR gate — and that is now a checkable claim rather than a comment:
    # `tests/test_docs.py` reads both workflows and asserts this list covers
    # ci.yml's job set. It said this while ruff, pyright, the ceiling leg and
    # the frontend suite ran on the PR only (finding M3).
    needs: [lint, test, test-highest, web, smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: read    # required so actions/checkout@v6 can read the repo
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # hatch-vcs needs full history + tags to derive the version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `nodum/_web/` is gitignored, so a fresh checkout has no bundle and
      # hatchling would ship the "UI not built" placeholder. GitHub Actions
      # jobs do not share a filesystem, so the bundle the `web` job builds is
      # unreachable here — it has to be built in this job, immediately before
      # the wheel that re-includes it via `artifacts = ["nodum/_web/**"]`.
      - name: Build the UI bundle
        run: make web-install web-build

      - name: Check the bundle was emitted
        run: test -f nodum/_web/index.html && test -d nodum/_web/assets

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # Pinned to an exact release tag (not the floating `release/v1` branch):
        # this job holds OIDC publish rights, so its action ref must not be a
        # moving target someone else controls.
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          # A tag re-push (e.g. amending lint fixes onto an already-released
          # version) re-runs this job; without this the second run hard-fails
          # with "400 File already exists" instead of being a no-op.
          skip-existing: true
