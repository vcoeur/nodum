[project]
name = "nodum"
dynamic = ["version"]
description = "DB-native knowledge graph: a typed graph of Markdown-content nodes and typed edges in one SQLite file, with an append-only event log, node versions, undo, and wikilink materialization — behind a deterministic, LLM-free service layer and a JSON-emitting CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alice Voland" }]
requires-python = ">=3.12"
dependencies = [
    # Each major bound is a deliberate decision: either the next major is capped
    # as a breaking unknown (the mcp 2.0.0 class), or the dep is marked
    # "ceiling-tested" — the CI highest-resolution leg and the smoke install's
    # fresh resolution exercise the ceiling, so a break surfaces there instead
    # of on a fresh install.
    # Declared because `nodum.http_api` imports it directly — for the login
    # route's own `CapacityLimiter`, which bounds how many argon2 hashes may be
    # in flight at once. It arrives transitively with starlette either way, and
    # that is exactly the trap: an undeclared import that happens to resolve is
    # the B1 shape, one dependency-tree change away from a fresh install that
    # cannot import.
    #
    # The floor is 4.2 because that is where the behaviour this package relies
    # on arrives, measured by installing each: `http_api` builds its argon2
    # limiter at module level, and `anyio.CapacityLimiter(2)` outside a running
    # event loop raises `AsyncLibraryNotFoundError` on 4.0 and 4.1, returning a
    # `CapacityLimiterAdapter` from 4.2 on.
    #
    # **It is inert today and declared anyway.** `mcp>=1.28.1` requires
    # `anyio>=4.5` and pulls `sse-starlette`, which requires `>=4.7.0`, so the
    # reachable floor is 4.7 — no resolution from this file can land below it
    # whatever this line says, and `>=4` and `>=4.2` select the same version
    # (they do record different specifiers in `uv.lock`). That is a fact about other
    # people's metadata, which is the whole reason to write our own bound down:
    # the day `mcp` relaxes its floor, this line is what stops the resolver
    # walking into a version where importing `nodum.http_api` raises. A bound
    # that is currently unreachable is not a bound that is wrong.
    "anyio>=4.2,<5",
    "argon2-cffi>=23",         # ceiling-tested: year-major versioning, API stable for a decade
    "mcp>=1.28.1,<2",          # mcp 2.0.0 removed mcp.server.fastmcp, which nodum.mcp_server imports
    "pillow>=11",              # ceiling-tested: mature, non-breaking majors; tiny API surface used
    "pydantic>=2.9,<3",        # a pydantic 3 major would break the BaseModel API the suite exercises
    "sqlite-vec>=0.1.9,<1",    # young package; native extension loaded on every connection
    "starlette>=0.48,<2",      # 1.3.1 is the locked, tested major; <2 guards the next breaking major
    "typer>=0.16,<1",          # typer has been 0.x forever; a 1.0 is the breaking major
    "uvicorn>=0.34,<1",        # uvicorn 1.0 not yet released; keeps the tested 0.x major
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Repository = "https://github.com/vcoeur/nodum"
Issues = "https://github.com/vcoeur/nodum/issues"

[project.scripts]
nodum = "nodum.cli:app"

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.8.0,<1",     # young package (0.8.x); this extra is absent from the CI ceiling leg
]
# Extraction handlers (design §5.7, Phase 4). Each is optional on purpose: a
# handler whose dependency is absent reports itself unavailable and is skipped,
# exactly as the embedding provider does — `nodum ingest` on a bare install
# still registers the asset and says plainly that no text came out. Keeping
# them out of the base install is what keeps `pipx install nodum` light.
pdf = [
    "pypdf>=5,<7",             # text extraction — pypdf majors have broken it before; 6.14.2 tested
    "pypdfium2>=4",            # page rasters — ceiling-tested: this extra runs in the CI ceiling leg
]
ocr = [
    "pytesseract>=0.3,<1",     # also needs the tesseract binary on PATH; 0.3.x for years
]
audio = [
    "faster-whisper>=1,<2",    # 1.x is the current major; <2 guards the next one
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from the git tag (vX.Y.Z) at build time — never committed.
# The fallback keeps untagged checkouts buildable.
[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["nodum"]
# The Vite bundle is built into nodum/_web/ and gitignored, so hatchling's
# VCS-based file selection would ship an empty directory. `artifacts` re-includes
# ignored paths — run `make web-build` before building a wheel or the UI will be
# the "not built" placeholder.
artifacts = ["nodum/_web/**"]

# The same re-include is required on the sdist, and it is not redundant: a bare
# `uv build` builds the sdist and then builds the wheel *from that sdist*, so
# anything the sdist drops cannot reappear in the wheel. Without this, `uv build`
# silently produced a placeholder-UI wheel while `uv build --wheel` (which reads
# the source tree directly) produced a correct one — which is exactly how v0.2.0
# shipped with no UI despite a green release.
[tool.hatch.build.targets.sdist]
artifacts = ["nodum/_web/**"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    # Test-only, and deliberately not a runtime dependency: the one consumer is
    # tests/test_docs.py, which reads .github/workflows/*.yml to assert the tag
    # gate is not weaker than the PR gate. That test hand-parsed YAML with
    # regexes to avoid this line, and the hand parser was caught silently
    # mis-reading a workflow in three consecutive reviews — in the one test
    # whose purpose is catching silent drift. See that module's docstring.
    "pyyaml>=6,<7",            # 6.x since 2021; a 7.0 would be the breaking major
    "ruff>=0.15.2",
]
# The docs gate, declared so `make docs` can run it the way CI does. Exact
# pins rather than ranges: this builds a published site, and mkdocs-material's
# minor releases move theme markup — the point of the group is that the local
# build and the CI build are the same build. `docs.yml` names the same two
# versions inline, because the Pages job installs them into an ephemeral env
# rather than syncing this project's groups.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
# Type-checking scope: the 25 nodum/ package modules. tests/ is deliberately
# excluded — M29 is about the package's ~29k annotated lines. `typeCheckingMode
# = "standard"` is pyright's default; it is set explicitly so the mode is
# documented. There is deliberately no blanket `ignore` of any error rule: the
# only suppressions in the tree are the per-site `# pyright: ignore` comments on
# the 7 optional-dependency imports (fastembed, loguru, pytesseract,
# faster_whisper), whose degraded-mode design makes an absent dependency a
# returned result, never an exception.
include = ["nodum"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "SIM117"]

[tool.ruff.lint.per-file-ignores]
# Typer's Option(...) / Argument(...) default-arg pattern is idiomatic; B008 flags it.
"nodum/cli.py" = ["B008"]
