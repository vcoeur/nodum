<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!--
      Inlined as a data URI on purpose: the app is served by a local Python
      process from a directory Vite wipes on every build, so an asset file here
      would be one more thing to package. Declaring it also stops the browser
      requesting /favicon.ico on every load. (A request for that path is
      answered honestly server-side either way — `nodum.http_api` routes it
      ahead of the SPA catch-all and returns a 204 when there is no icon file —
      but not asking at all is better than asking and getting nothing.)
      Colours are tokens.css literals: brass accent, active sea-green, proposed
      violet.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312151a'/%3E%3Cpath d='M16 11 L10 21 M16 11 L23 19' stroke='%238c6f31' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='11' r='4' fill='%23c9a24a'/%3E%3Ccircle cx='10' cy='21' r='3' fill='%235aa17f'/%3E%3Ccircle cx='23' cy='19' r='3' fill='%238b7fd4'/%3E%3C/svg%3E"
    />
    <title>nodum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
